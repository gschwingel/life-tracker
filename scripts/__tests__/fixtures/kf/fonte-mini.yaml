# FIXTURE — fonte de curadoria mínima para os testes do compilador (Fase A2).
# NÃO é o kf-fonte.yaml de produto (esse nasce na Fase A3 com 13 KFs).
# Normativo: FDV-PLAN v7.1 §4 (particionamento = curadoria humana).
meta:
  version: 0.1
  frozen: 2026-09-13
  idioma_saida: en-dense
  saida_dir: LILA-DEV/kfs/

kfs_padrao:
  - slug: KF-DOC
    origem: framework
    eixo: capacidade
    escopo: >
      Documentacao de projetos como rastro auditavel.
    fronteiras: >
      A DISCIPLINA documental vive aqui; documentacao de USO de subsistema segue o KF dele.
  - slug: KF-INDICES
    origem: framework
    eixo: capacidade
    escopo: >
      Indices e frescor; indice e artefato derivado.
    fronteiras: >
      O indice DE um dominio especifico segue o KF do dominio.

kfs_produto:
  - slug: KF-BACKEND
    origem: projeto
    eixo: componente
    escopo: >
      Infraestrutura de produto.
    fronteiras: >
      Schema-como-implementacao segue o KF do dominio; migrations vivem aqui.
